<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uncommonweneed.shop</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none; }
        input, textarea, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background-color: #0051c3; color: white; border: none; cursor: pointer; font-weight: bold; }
        .post { border-bottom: 1px solid #eee; padding: 10px 0; }
        .post img { max-width: 100%; height: auto; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>게시판 시스템</h1>

    <!-- 로그인/회원가입 영역 -->
    <div id="authSection" class="box">
        <h3 id="authTitle">로그인</h3>
        <input type="text" id="authUsername" placeholder="아이디">
        <input type="password" id="authPassword" placeholder="비밀번호">
        <button id="loginBtn" onclick="handleLogin()">로그인</button>
        <button id="signupBtn" onclick="handleSignup()" style="background-color: #4CAF50;">회원가입</button>
    </div>

    <!-- 사용자 로그인 상태 영역 -->
    <div id="userSection" class="box hidden">
        <p><b id="loggedInUser"></b>님 환영합니다!</p>
        <button onclick="handleLogout()" style="background-color: #666;">로그아웃</button>
    </div>

    <!-- 글 작성 영역 -->
    <div id="writeSection" class="box hidden">
        <h3>새 글 작성</h3>
        <form id="postForm">
            <textarea id="postContent" placeholder="내용을 입력하세요..." required></textarea>
            <input type="file" id="postImage" accept="image/*">
            <button type="submit">게시하기</button>
        </form>
    </div>

    <!-- 게시글 목록 -->
    <h3>게시글 목록</h3>
    <div id="postsList"></div>

    <script>
        let currentUser = localStorage.getItem('currentUser');

        function updateUI() {
            if (currentUser) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('userSection').classList.remove('hidden');
                document.getElementById('writeSection').classList.remove('hidden');
                document.getElementById('loggedInUser').innerText = currentUser;
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('userSection').classList.add('hidden');
                document.getElementById('writeSection').classList.add('hidden');
            }
            loadPosts();
        }

        async function handleSignup() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                alert('회원가입 성공! 로그인해 주세요.');
            } else {
                alert(data.error);
            }
        }

        async function handleLogin() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data.username;
                localStorage.setItem('currentUser', currentUser);
                updateUI();
            } else {
                alert(data.error);
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            updateUI();
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('postContent').value;
            const imageFile = document.getElementById('postImage').files[0];

            const formData = new FormData();
            formData.append('author', currentUser);
            formData.append('content', content);
            if (imageFile) formData.append('image', imageFile);

            const res = await fetch('/api/posts', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                document.getElementById('postContent').value = '';
                document.getElementById('postImage').value = '';
                loadPosts();
            } else {
                alert('게시글 업로드 실패');
            }
        });

        async function loadPosts() {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const listDiv = document.getElementById('postsList');
            listDiv.innerHTML = '';

            posts.forEach(post => {
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <strong>${post.author}</strong> <small>(${post.created_at})</small>
                    <p>${post.content}</p>
                    ${post.image_url ? `<img src="${post.image_url}">` : ''}
                `;
                listDiv.appendChild(postDiv);
            });
        }

        updateUI();
    </script>
</body>
</html>
